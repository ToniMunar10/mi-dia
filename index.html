<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Día</title>
<meta name="theme-color" content="#B95F36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Día">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html{-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
.copybox{width:100%;min-height:120px;margin-top:10px;font:13px ui-monospace,monospace;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
html,body{background:#B95F36}
</style>
</head>
<body>
<style>
/* Layout: phone-first single column; sticky header (date, tabs, week strip), today's blocks in time order; tapping a block opens its detail screen. */
/* One deliberate look in every theme: orange ground, warm-white cards. */
:root{
  --bg:#B95F36; --onbg:#FFFFFF; --onbg-muted:#F6DCCD; --onbg-hi:#FFE3A3;
  --surface:#FFF9F5; --line:#EEDDD2; --ink:#22140C; --muted:#7A6152;
  --gym:#A9532E; --gym-soft:#F8E6DB;
  --food:#1D7A80; --food-soft:#DDEFF0;
  --work:#6A4C9C; --work-soft:#EEE8F7;
  --rest:#2E7D5B; --rest-soft:#E1F1E9;
  --now:#A9532E;
  --display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);color:var(--onbg);padding-block:14px 8px;display:grid;gap:12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hleft{display:flex;align-items:center;gap:10px;min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
header .sub{color:var(--onbg-muted)}
.sub{color:var(--muted);font-size:.85rem}
.sync{font-size:.75rem;color:var(--onbg-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--onbg-muted)}
.dot.on{background:var(--onbg-hi)}
.back{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);color:var(--gym);font:700 1.4rem var(--display);cursor:pointer;line-height:1}

nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
nav.tabs button{font:600 .9rem var(--display);border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--gym);color:var(--surface)}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--onbg-hi);outline-offset:2px}

.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-6px}
.wnav span{font:600 .9rem var(--display);color:var(--onbg)}
.wnav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:36px;height:32px;border-radius:9px;font:700 1.1rem var(--display);cursor:pointer;line-height:1}
.wnav button.hoy{width:auto;padding:0 12px;font-size:.8rem;color:var(--gym)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 0 7px;cursor:pointer;color:var(--onbg);display:grid;justify-items:center;gap:2px;font-family:var(--body)}
.week .wd{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--onbg-muted)}
.week .dn{font:700 1.1rem var(--display);font-variant-numeric:tabular-nums}
.week .mk{width:6px;height:6px;border-radius:50%}
.week button.today .dn{color:var(--onbg-hi)}
.week button.sel{background:var(--surface);border-color:var(--surface);color:var(--ink)}
.week button.sel .wd{color:var(--muted)}
.week button.today.sel .dn{color:var(--gym)}
.week button.past{opacity:.6}

section{display:grid;gap:12px;margin-top:8px}
section > .tip{color:var(--onbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;padding:5px 11px;border-radius:999px}
.chip.work{background:var(--work-soft);color:var(--work)}
.chip.gym{background:var(--gym-soft);color:var(--gym)}
.chip.rest{background:var(--rest-soft);color:var(--rest)}
.chip.free{background:var(--surface);color:var(--muted);border:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{font-family:var(--display);font-size:1.05rem;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.8rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tip{font-size:.9rem;color:var(--muted);margin:0}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.kcal{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kcal b{font:700 1.4rem var(--display);font-variant-numeric:tabular-nums}

/* timeline */
.timeline{display:grid}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit}
.ev:first-child{border-top:0;padding-top:2px}
button.ev{cursor:pointer}
.ev .t{font:700 .95rem var(--display);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ev.food .k{color:var(--food)} .ev.gym .k{color:var(--gym)} .ev.work .k{color:var(--work)} .ev.other .k{color:var(--rest)}
.ev .n{font-weight:700;margin:1px 0 2px}
.ev .d{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.ev .kc{font-size:.78rem;color:var(--food);font-weight:700;font-variant-numeric:tabular-nums}
.ev .go{color:var(--muted);font:700 1.2rem var(--display);padding-top:8px}
.ev.next .t{color:var(--now)}
.ev.next .k::after{content:" · ahora toca";color:var(--now)}
.ev.done{opacity:.5}

/* list rows that open a detail */
.rows{display:grid}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0;padding-top:2px}
.row .num{font:700 .95rem var(--display);color:var(--gym);font-variant-numeric:tabular-nums;padding-top:1px}
.row .rn{font-weight:700}
.row .rs{color:var(--ink);font-size:.92rem}
.row .rl{color:var(--muted);font-size:.82rem;margin-top:2px}
.row .go{color:var(--muted);font:700 1.2rem var(--display)}
.row.ok .num::after{content:" ✓"}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--rest-soft);color:var(--rest);margin-left:6px;vertical-align:1px}

/* exercise detail */
.target{display:grid;gap:4px}
.target b{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums;color:var(--gym)}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center}
.set span{font-size:.85rem;color:var(--muted);font-weight:700}
.set label{display:grid;gap:2px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.set input{font:700 1.15rem var(--display);font-variant-numeric:tabular-nums;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.set input:focus{border-color:var(--gym);outline:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 .95rem var(--display);border-radius:11px;padding:11px 16px;border:0;cursor:pointer}
.btn.primary{background:var(--gym);color:var(--surface);flex:1}
.btn.ghost{background:var(--gym-soft);color:var(--gym)}
.saved{font-size:.85rem;color:var(--rest);font-weight:700;min-height:1.2em}
.hist{display:grid}
.hrow2{display:grid;grid-template-columns:78px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.hrow2:first-child{border-top:0;padding-top:0}
.hrow2 .hd{font-weight:700;font-size:.9rem}
.hrow2 .hs{font-variant-numeric:tabular-nums;font-size:.95rem}
.hrow2 .hn{grid-column:2 / 4;font-size:.8rem;color:var(--muted)}
.delta{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--rest)} .delta.down{color:var(--gym)} .delta.eq{color:var(--muted)}
.spark{width:100%;height:64px;display:block}

/* meal detail */
table.ing{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.ing th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:0 0 6px;font-weight:700}
table.ing th:first-child{text-align:left}
table.ing td{padding:9px 0;border-top:1px solid var(--line);text-align:right;font-size:.95rem}
table.ing td:first-child{text-align:left;padding-right:8px}
table.ing td.g{color:var(--muted);white-space:nowrap;padding-left:8px}
table.ing td.kc{font-weight:700;padding-left:10px;white-space:nowrap}
table.ing td.p{color:var(--muted);padding-left:10px;white-space:nowrap}
table.ing tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.macro{background:var(--food-soft);border-radius:12px;padding:10px 12px}
.macro b{display:block;font:700 1.6rem var(--display);color:var(--food);font-variant-numeric:tabular-nums}
.macro span{font-size:.78rem;color:var(--food);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* week + shopping */
.wk{display:grid;gap:8px}
.wkrow{display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.wkrow .day{font:700 1rem var(--display)}
.wkrow .day span{display:block;font:400 .75rem var(--body);color:var(--muted)}
.wkrow .rr{display:grid;gap:4px;min-width:0}
.wkrow.today{border:2px solid var(--ink)}
.wkhead{font:700 .8rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--onbg);margin-top:8px}
.shopcard{display:grid;gap:10px}
.shopcard summary{list-style:none;cursor:pointer;display:grid;gap:8px}
.shopcard summary::-webkit-details-marker{display:none}
.shop h3{font:700 .95rem var(--display);margin:4px 0 4px}
.shop label{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.shop label input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--food);border-radius:50%;margin:0}
.shop label input:checked{background:var(--food)}
.shop label input:checked + span{text-decoration:line-through;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--food);transition:width .3s}

/* work calendar */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font:700 1.15rem var(--display);text-transform:capitalize}
.mnav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:36px;height:32px;border-radius:9px;font:700 1.1rem var(--display);cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wh{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cell{min-height:70px;border-radius:9px;padding:4px 4px 5px;display:grid;grid-template-rows:auto 1fr auto;background:var(--cell,#F4EEE9);border:2px solid transparent;cursor:pointer;font:inherit;color:inherit;text-align:center;min-width:0}
.cell .cn{font:700 .8rem var(--display);text-align:right;font-variant-numeric:tabular-nums}
.cell .cs{font:700 .78rem var(--display);align-self:center;font-variant-numeric:tabular-nums;color:var(--cellink,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cd{display:flex;justify-content:center;gap:3px;min-height:7px}
.cell .cd i{width:7px;height:7px;border-radius:50%;display:block}
.cell.out{visibility:hidden}
.cell.today .cn{color:var(--gym);text-decoration:underline;text-underline-offset:2px}
.cell.sel{border-color:var(--ink)}
.s-noche{--cell:#ECE3F8;--cellink:#5B3E8E} .s-tarde{--cell:#FBE1EA;--cellink:#9C2F5B}
.s-medio{--cell:#FFF1C2;--cellink:#7A5A00} .s-libre{--cell:#E1F1E9;--cellink:#2E7D5B}
.s-viaje{--cell:#DDEBF7;--cellink:#2C5E8C} .s-nada{--cell:#F4EEE9;--cellink:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dotl{border-radius:50%}
.match{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.match:first-child{border-top:0;padding-top:0}
.match .mt{font:700 .95rem var(--display);font-variant-numeric:tabular-nums}
.match .mv{font-weight:700}
.match .mc{font-size:.8rem;color:var(--muted)}
.tm{display:inline-block;font-size:.68rem;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.warn{font-size:.8rem;font-weight:700;color:var(--gym)}
.okk{font-size:.8rem;font-weight:700;color:var(--rest)}
.mday{font:700 .8rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:10px}

.ico{height:1.15em;width:1.15em;vertical-align:-.22em;display:inline-block}
.ev .k .ico{height:1.35em;width:1.35em;vertical-align:-.3em}
.fico{font-size:1.15em;margin-right:5px;vertical-align:-.08em;letter-spacing:0}
.chip .ico{height:1.1em;width:1.1em}
.crest{height:1.35em;width:auto;vertical-align:-.32em;margin-right:4px;display:inline-block}
.cell .cd{gap:1px}
.cell .cd .crest{height:15px;margin:0}
.legend .crest{height:16px;margin:0}
/* rest timer bar, fixed to the bottom edge */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.rest.go{background:var(--rest)}
.rinner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rtime{display:grid;line-height:1.15;min-width:0}
.rtime .lbl{color:#F1D9CC}
.rtime .sub{color:#E9D3C6;font-size:.78rem}
.rtime b{font:700 1.9rem var(--display);font-variant-numeric:tabular-nums}
.rest.go .rtime b{font-size:1.2rem}
.rbtns{display:flex;gap:6px;flex-wrap:wrap}
.rbtns button{font:700 .9rem var(--display);border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font-variant-numeric:tabular-nums}
.rbtns button.on{background:#fff;color:var(--ink)}
.rbtns button.start{background:var(--gym);color:#fff}
.rprog{max-width:560px;margin:8px auto 0;height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.rprog i{display:block;height:100%;background:var(--onbg-hi)}
body.has-rest .wrap{padding-bottom:110px}
.tec summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.tec summary::-webkit-details-marker{display:none}
.tec summary .sub{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tec summary .go{color:var(--muted);font:700 1.2rem var(--display);transition:transform .2s}
.tec[open] summary .go{transform:rotate(90deg)}
a.btn.vid{display:block;text-align:center;text-decoration:none;margin-top:14px;background:var(--ink);color:#fff}
.em{font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:0;border-radius:16px;padding:12px 8px 10px;display:grid;justify-items:center;gap:4px;text-align:center;font:inherit;color:var(--ink);min-width:0}
button.tile{cursor:pointer}
.tile .ti{height:30px;display:grid;place-items:center;font-size:1.6rem}
.tile .ti .ico{width:30px;height:30px;color:var(--gym)}
.tile .ti .sport{height:18px}
.tile b{font:700 1.05rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile small{font-size:.72rem;color:var(--muted);white-space:nowrap}
.tl{display:grid;gap:8px}
.it{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface);border:2px solid transparent;border-radius:16px;padding:9px 12px 9px 9px;text-align:left;font:inherit;color:var(--ink);width:100%}
button.it{cursor:pointer}
.it .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.45rem;background:var(--food-soft)}
.it.gym .ic{background:var(--gym-soft);color:var(--gym)} .it.gym .ic .ico{width:28px;height:28px}
.it.work .ic{background:var(--work-soft)} .it.work .ic .sport{height:auto;width:38px}
.it.shop .ic{background:var(--food-soft);color:var(--food)} .it.shop .ic .ico{width:26px;height:26px}
.it.other .ic{background:var(--rest-soft)}
.it.match .ic{background:#F4EEE9}
.crests{display:flex;align-items:center;justify-content:center;gap:1px}
.crests .crest{height:30px;margin:0}
.crests .crest + .crest{height:24px}
.it .tx{display:grid;min-width:0;line-height:1.25}
.it .hh{font:700 .82rem var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.it .lab{font-weight:600;color:var(--muted)}
.it .nn{font:700 1.02rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.work .lab{color:var(--ink);font-size:.95rem}
.it .pill,.pill{font:700 .78rem var(--display);font-variant-numeric:tabular-nums;background:var(--bg);color:#fff;border-radius:999px;padding:3px 9px;white-space:nowrap}
.it.food .pill{background:var(--food-soft);color:var(--food)}
.it.gym .pill{background:var(--gym-soft);color:var(--gym)}
.it.shop .pill{background:var(--food-soft);color:var(--food)}
.it .go{color:var(--muted);font:700 1.2rem var(--display)}
.it.next{border-color:var(--ink)}
.it.done{opacity:.55}
.now{font-style:normal;background:var(--gym);color:#fff;border-radius:6px;padding:1px 6px;font-size:.68rem;letter-spacing:.06em;margin-left:2px}
.tips summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font:700 1rem var(--display)}
.tips summary::-webkit-details-marker{display:none}
.tips .pill{background:var(--gym-soft);color:var(--gym)}
.gprog{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:6px;color:var(--gym)}

  };
  const crest = t => TEAMS[t] ? `<img class="crest" src="${TEAMS[t].img}" alt="${TEAMS[t].nombre}">` : "";

  function setSync(on, txt){ $("#syncDot").classList.toggle("on", on); $("#syncTxt").textContent = txt }

  /* ---------- data helpers ---------- */
  function recetaOf(c){ return c && c.receta && recetas[c.receta] ? recetas[c.receta] : null }
  function totals(r){ const t = {kcal:0, p:0}; (r.ingredientes||[]).forEach(i => { t.kcal += Number(i.kcal)||0; t.p += Number(i.p)||0 }); return t }
  function mealKcal(c){ const r = recetaOf(c); return r ? Math.round(totals(r).kcal) : (Number(c.kcal)||0) }
  function mealProt(c){ const r = recetaOf(c); return r ? Math.round(totals(r).p) : 0 }
  function logsFor(exId){ return registros.filter(r => r.data.ejercicio === exId).sort((a,b)=> b.data.fecha.localeCompare(a.data.fecha)) }
  function topKg(r){ return Math.max(...(r.data.series||[]).map(s => num(s.kg) ?? -Infinity)) }
  function eatenOf(iso){ return (hechas[iso] && hechas[iso].meals) || {} }
  function parseTarget(x){
    const m = /^(\d+)(?:\s*-\s*(\d+))?\s*[×x]\s*([^·]+?)(?:\s*·\s*(.+))?$/.exec(x.series||"");
    if (!m) return {ser:"", serN:2, reps:x.series||"", repsN:null, kg:"", kgN:null, unit:"kg", same:false};
    const reps = m[3].trim(), kgRaw = (m[4]||"").trim();
    const same = !!kgRaw && !/\d/.test(kgRaw);
    const kgN = same ? null : num((kgRaw.match(/[\d.,]+/)||[""])[0]);
    return { ser: m[2] ? m[1]+"-"+m[2] : m[1], serN: +(m[2]||m[1]), reps, repsN: num((reps.match(/\d+/)||[""])[0]),
             kg: same ? "" : kgRaw.replace(/\s*kg.*$/,""), kgN, unit: /por mano/.test(kgRaw) ? "kg/mano" : "kg", same };
  }
  function actIcon(txt){
    const t = (txt||"").toLowerCase();
    return t.includes("pádel")||t.includes("padel") ? "🎾" : t.includes("futsal") ? "⚽" : t.includes("viaje")||t.includes("galicia") ? "✈️" : t.includes("descanso") ? "😴" : "";
  }
  const futOn = iso => futsal.find(f => f.fecha === iso);
  function dayIcon(d, iso){
    const out = [];
    if (iso && futOn(iso)) out.push(`<span class="em mini">⚽</span>`);
    if (d && d.gym) out.push(`<span class="mini gymc">${DUMB}</span>`);
    else if (d && !(iso && futOn(iso))){ const e = actIcon(d.actividad || d.titulo); if (e && e !== "⚽") out.push(`<span class="em mini">${e}</span>`) }
    return out.join("");
  }
  function cellIcons(iso, tms){
    const act = shiftOf(iso).cls === "s-viaje" ? [] : dayIcon(days[iso], iso).match(/<span class="(?:em )?mini[^"]*">.*?<\/span>(?:<\/span>)?/g) || [];
    const icons = [...act.slice(0,1), ...tms.map(crest)];
    const extra = icons.length > 2 ? `<span class="more">+${icons.length-2}</span>` : "";
    return icons.slice(0, extra ? 1 : 2).join("") + extra;
  }
  function futRow(f){
    return `<div class="match"><div class="mt">${esc(f.hora)}</div><div style="min-width:0"><div class="mv"><span class="em">⚽</span>SPORT – ${esc(f.rival)}</div>
      <div class="mc"><span class="cpill">${esc(f.jornada)}</span><span class="cpill">📍 ${esc(f.lugar)}</span></div></div></div>`;
  }
  function mealTitle(c){
    if (/estándar/i.test(c.titulo||"")) return c.nombre;
    return (c.titulo||c.nombre).replace(/^Tupper:\s*/,"").replace(/\s*\(.*?\)\s*/g,"");
  }
  function shiftOf(iso){
    const d = days[iso];
    if (!d || !d.trabajo) return {cls:"s-nada", txt:"", label:"Sin datos"};
    const t = d.trabajo;
    if (t.inicio){
      const cls = t.inicio >= "18:00" ? "s-noche" : t.inicio >= "15:00" ? "s-tarde" : "s-medio";
      return {cls, txt:`${+t.inicio.slice(0,2)}h`, label:`${t.inicio}–${t.fin}`, ini:mins(t.inicio), fin:mins(t.fin)};
    }
    if (/viaje/i.test(t.texto||"")) return {cls:"s-viaje", txt:"✈️", label:"De viaje"};
    return {cls:"s-libre", txt:"Libre", label:"Libre"};
  }
  function clash(p, sh){
    if (!p.hora || sh.ini == null) return sh.cls==="s-viaje" ? "✈️ De viaje" : sh.cls==="s-libre" ? "🟢 Puedes verlo" : "";
    let s = sh.ini, e = sh.fin; if (e <= s) e += 1440;
    const m = mins(p.hora);
    if (m >= s && m < e) return "🔴 Trabajando";
    if (m + 110 > s && m < s) return "🟡 Solo la 1ª parte";
    return "🟢 Puedes verlo";
  }
  function matchRow(p){
    const c = clash(p, shiftOf(p.fecha));
    const comp = /champions/i.test(p.comp)?"Champions":/copa/i.test(p.comp)?"Copa":/clásico/i.test(p.comp)?"Clásico":"";
    return `<div class="match"><div class="mt">${esc(p.hora||"—")}</div><div style="min-width:0">
      <div class="mv"><span class="crests">${p.equipos.map(crest).join("")}</span>${esc(p.local)} – ${esc(p.visitante)}</div>
      <div class="mc">${comp?`<span class="cpill">${comp}</span>`:""}${p.provisional||!p.hora?'<span class="cpill">hora por confirmar</span>':""}${c?`<span class="cpill">${esc(c)}</span>`:""}</div></div></div>`;
  }
  function sparkSvg(vals, w, h, color){
    if (vals.length < 2) return "";
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi-lo || 1, P = 3;
    const X = i => P + i*(w-2*P)/(vals.length-1), Y = v => h-P - (v-lo)*(h-2*P)/span;
    const line = vals.map((v,i)=> (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="3" fill="${color}"/></svg>`;
  }

  /* ---------- header & week strip ---------- */
  const kindColor = {gym:"var(--onbg-hi)", deporte:"var(--onbg)", descanso:"var(--onbg-muted)"};
  function renderHeader(){
    const dt = dateOf(sel || todayIso());
    const inDetail = tab === "hoy" && detail;
    $("#back").hidden = !inDetail;
    $("#tabs").hidden = !!inDetail;
    const H = (t, s) => { $("#hTitle").textContent = t; $("#hSub").textContent = s };
    if (inDetail){
      const d = days[sel] || {};
      if (detail.type === "gym") H(d.gym.titulo, WDL[dt.getDay()]+" "+dt.getDate()+" · "+(d.gym.hora||""));
      else if (detail.type === "ex"){ const x = d.gym.ejercicios[detail.i]; H(x.nombre, d.gym.titulo+" · "+(detail.i+1)+" de "+d.gym.ejercicios.length) }
      else if (detail.type === "meal"){ const c = d.comidas[detail.i]; H(mealTitle(c), c.nombre+" · "+c.hora) }
      else if (detail.type === "compra"){ const L = compras.find(c => c.id === detail.id); H("Lista de la compra", L ? L.data.titulo : "") }
    } else if (tab === "hoy") H((sel===todayIso()?"Hoy, ":"") + WDL[dt.getDay()] + " " + dt.getDate(), days[sel] && days[sel].titulo ? days[sel].titulo : MES[dt.getMonth()]);
    else if (tab === "cal") H("Calendario", "Turnos, entrenos y partidos");
    else if (tab === "prog") H("Progreso", "Tu peso y tus marcas");
    else H("Informe semanal", "Cada domingo por la noche");
    document.querySelectorAll("nav.tabs button").forEach(b=> b.setAttribute("aria-selected", b.id === "tab-"+tab ? "true":"false"));
    $("#foot").textContent = (plan && plan.actualizado ? "Plan actualizado: " + plan.actualizado + " · " : "") + "App v6";
  }
  function renderWeek(){
    const el = $("#week"), nav = $("#wnav");
    el.hidden = nav.hidden = tab !== "hoy" || !!detail || !Object.keys(days).length;
    if (el.hidden) return;
    const mon = mondayOf(sel), sun = new Date(mon); sun.setDate(mon.getDate()+6);
    const t = todayIso();
    const rango = mon.getMonth()===sun.getMonth() ? `${mon.getDate()}–${sun.getDate()} ${MES[sun.getMonth()]}`
      : `${mon.getDate()} ${MES[mon.getMonth()].slice(0,3)} – ${sun.getDate()} ${MES[sun.getMonth()].slice(0,3)}`;
    const enHoy = t >= isoOf(mon) && t <= isoOf(sun);
    nav.innerHTML = `<button data-shift="-7" aria-label="Semana anterior">‹</button><span>${rango}</span>
      <div style="display:flex;gap:6px">${enHoy?"":`<button class="hoy" data-shift="hoy">Hoy</button>`}<button data-shift="7" aria-label="Semana siguiente">›</button></div>`;
    let html = "";
    for (let i=0;i<7;i++){
      const d = new Date(mon); d.setDate(mon.getDate()+i);
      const iso = isoOf(d), data = days[iso];
      const cls = [iso===sel?"sel":"", iso===t?"today":"", iso<t?"past":""].join(" ");
      html += `<button class="${cls}" data-day="${iso}" aria-label="${WDL[d.getDay()]} ${d.getDate()}">
        <span class="wd">${WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span>
        <span class="mk" style="background:${data?(kindColor[data.tipo]||"transparent"):"transparent"}"></span></button>`;
    }
    el.innerHTML = html;
  }

  /* ---------- HOY ---------- */
  function timelineOf(d){
    const ev = [], eaten = eatenOf(sel);
    (d.comidas||[]).forEach((c,i) => ev.push({h:c.hora, k:"food", meal:i, eaten:!!eaten[i],
      icon:`<span class="em">${(recetaOf(c)||{}).icono||"🍽️"}</span>`, lab:c.nombre, n:mealTitle(c), tup:/^Tupper/i.test(c.titulo||""), pill:mealKcal(c), open:"meal:"+i}));
    if (d.gym && d.gym.hora){
      const exs = d.gym.ejercicios||[], done = exs.filter(x => registros.some(r => r.id === sel+"_"+x.id)).length;
      ev.push({h:d.gym.hora, k:"gym", icon:DUMB, lab:"Gym", n:d.gym.titulo, pill:`${done}/${exs.length}`, gym:true, open:"gym"});
    }
    if (d.trabajo && d.trabajo.inicio) ev.push({h:d.trabajo.inicio, k:"work", icon:LOGO, lab:"Hasta las "+(d.trabajo.fin||""), n:""});
    (d.otros||[]).forEach(o => {
      const L = o.compra && compras.find(c => c.id === o.compra);
      let pill = "";
      if (L){ const tot = (L.data.grupos||[]).reduce((s,g)=> s + (g.items||[]).length, 0), hech = Object.values(L.data.marcados||{}).filter(Boolean).length; pill = `${hech}/${tot}` }
      const em = actIcon(o.tipo) || (/prepar/i.test(o.tipo||"") ? "🥡" : "📌");
      ev.push({h:o.hora, k:o.compra?"shop":"other", icon:o.compra?CART:`<span class="em">${em}</span>`, lab:o.compra?"Compra":(o.tipo||""), n:o.compra?"":o.titulo, pill, open: o.compra ? "compra:"+o.compra : null});
    });
    futsal.filter(f => f.fecha === sel).forEach(f => ev.push({h:f.hora, k:"other", icon:'<span class="em">⚽</span>', lab:"Futsal · "+f.jornada, n:"vs "+f.rival, pill:"📍 "+f.lugar}));

  function buildDraft(x){

    if (a === "start") startRest(rest.pref);
    else if (a === "stop") stopRest();
    else if (a === "ok"){ rest.done = 0; drawRest() }
    else if (rest.end){ rest.end = Math.max(Date.now()+1000, rest.end + Number(a)*1000); rest.total = Math.max(rest.total, rest.end - Date.now()); store.set("restEnd", {end:rest.end, total:rest.total}); drawRest() }
  }, true);

  document.addEventListener("click", e=>{
    if (e.target.closest("#back")){ if (detail && detail.type==="ex") go({type:"gym"}); else go(null); return }
    if (e.target.closest("#addSet")){ const L = detail.draft[detail.draft.length-1] || {kg:"",reps:""}; detail.draft.push({kg:L.kg, reps:L.reps, ok:false}); render(); return }
    if (e.target.closest("#pesoSave")){ savePeso(); return }
    if (e.target.closest("#copyClaude")){ copyForClaude(); return }
    if (e.target.closest("#ghSave")){ ghConnect(); return }
    if (e.target.closest("#fotoBtn")){ foto.pick = true; render(); return }
    const fc = e.target.closest("[data-fcomida]");
    if (fc){ foto.comida = fc.dataset.fcomida === "x" ? null : Number(fc.dataset.fcomida); const fi = $("#fotoIn"); fi.value = ""; fi.click(); return }
    if (e.target.closest("#ghNow")){ gh.pending = true; ghPush(); return }
    if (e.target.closest("#ghOff")){ gh.token = ""; store.set("mi-dia-gh-token", ""); gh.err = ""; render(); return }
    const so = e.target.closest("[data-setok]"); if (so){ toggleSet(Number(so.dataset.setok)); return }
    const eat = e.target.closest("[data-eat]"); if (eat){ toggleEat(Number(eat.dataset.eat)); return }
    const cal = e.target.closest("[data-cal],[data-month],[data-goday]");
    if (cal){
      if (cal.dataset.goday){ sel = cal.dataset.goday; tab = "hoy"; detail = null; store.set("tab2", tab); render(); window.scrollTo(0,0); return }
      if (cal.dataset.cal) calSel = cal.dataset.cal;
      else { const [y,m] = calMonth.split("-").map(Number); const d = new Date(y, m-1+Number(cal.dataset.month), 1); calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1) }
      render(); return;
    }
    const t = e.target.closest("[data-open],[data-day],[data-shift],nav.tabs button");
    if (!t) return;
    if (t.dataset.open){
      const [type, i] = t.dataset.open.split(":");
      go(type==="gym" ? {type:"gym"} : type==="compra" ? {type, id:i} : {type, i:Number(i)});
    } else if (t.dataset.shift){
      if (t.dataset.shift === "hoy") sel = todayIso();
      else { const d = dateOf(sel); d.setDate(d.getDate() + Number(t.dataset.shift)); sel = isoOf(d) }
      render();
    } else if (t.dataset.day){ sel = t.dataset.day; render() }
    else { tab = t.id.replace("tab-",""); detail = null; store.set("tab2",tab); render(); window.scrollTo(0,0) }
  });
  document.addEventListener("input", e=>{
    const x = e.target;
    if (x.dataset.set !== undefined && detail && detail.draft){ detail.draft[+x.dataset.set][x.dataset.f] = x.value }
  });
  document.addEventListener("change", e => { if (e.target.id === "fotoIn") fotoTomada(e.target.files && e.target.files[0]) });
  document.addEventListener("keydown", e=>{ if (e.key === "Enter" && e.target.id === "pesoIn") savePeso() });
  document.addEventListener("change", async e=>{
    const x = e.target;
    if (x.dataset.buy && dbRef){
      try { await dbRef.doc("compra/"+x.dataset.list).update({marcados:{[x.dataset.buy]: x.checked}}) }
      catch(err){ x.checked = !x.checked; setSync(false, "No se pudo guardar") }
    }
  });
  setInterval(()=>{ if (tab==="hoy" && !detail && sel===todayIso()) renderHoy() }, 60000);

  /* ---------- data: plan from data.json (cached for offline), your logs on this phone ---------- */
  (async ()=>{
    const LKEY = "mi-dia-local-v1", RKEY = "mi-dia-remote-v1";
    let remote = store.get(RKEY);
    const local = Object.assign({registros:{}, peso:{}, hechas:{}, marcas:{}}, store.get(LKEY) || {});
    const saveLocal = () => store.set(LKEY, local);
    const listeners = {}, planL = [];
    const R = c => (remote && remote[c]) || {};
    function docsOf(c){
      let m = Object.assign({}, R(c));
      if (c === "registros" || c === "peso" || c === "hechas") Object.assign(m, local[c]);
      if (c === "compra") Object.keys(m).forEach(id => { m[id] = Object.assign({}, m[id], {marcados: Object.assign({}, m[id].marcados, local.marcas[id])}) });
      return Object.entries(m).filter(([,d]) => d != null).map(([id,d]) => ({id, exists:true, data:()=>d}));
    }
    const emit = c => (listeners[c]||[]).forEach(fn => fn({docs: docsOf(c)}));
    const emitAll = () => { Object.keys(listeners).forEach(emit); planL.forEach(fn => fn(planSnap())) };
    const planSnap = () => remote && remote.plan ? {exists:true, data:()=>remote.plan} : {exists:false, data:()=>undefined};
    const db = {
      collection: c => ({ onSnapshot(fn){ (listeners[c] = listeners[c] || []).push(fn); fn({docs: docsOf(c)}); return ()=>{} } }),
      doc(path){
        const [c, id] = path.split("/");
        return {
          onSnapshot(fn){ if (path === "info/plan"){ planL.push(fn); fn(planSnap()) } return ()=>{} },
          async set(data){ local[c] = local[c] || {}; local[c][id] = data; saveLocal(); emit(c); if (c === "registros" || c === "hechas") ghDirty() },
          async update(data){ if (c === "compra"){ local.marcas[id] = Object.assign({}, local.marcas[id], data.marcados); saveLocal(); emit(c) } },
          async delete(){ local[c] = local[c] || {}; local[c][id] = null; saveLocal(); emit(c); if (c === "registros") ghDirty() }
        };
      }
    };
    dbRef = db;
    window.__miDiaLocal = local;
    // logs coming back from GitHub (new phone / reinstall): fill in what this phone doesn't have
    mergeRemoteLogs = (regs, coms) => {
      let n = 0, m = 0;
      Object.entries(coms || {}).forEach(([id, d]) => { if (!(id in local.hechas)) { local.hechas[id] = d; m++ } });
      if (m){ saveLocal(); emit("hechas") }
      Object.entries(regs || {}).forEach(([id, d]) => { if (!(id in local.registros) && !(remote && remote.registros && remote.registros[id])) { local.registros[id] = d; n++ } });
      if (n){ saveLocal(); emit("registros") }
    };
    const onErr = () => {};
    const mapCol = (col, fn) => db.collection(col).onSnapshot(snap => { fn(snap.docs.filter(d=>d.exists)); softRender() }, onErr);
    mapCol("dias", docs => { const n = {}; docs.forEach(d => n[d.id] = d.data()); days = n });
    mapCol("recetas", docs => { const n = {}; docs.forEach(d => n[d.id] = d.data()); recetas = n });
    mapCol("ejercicios", docs => { const n = {}; docs.forEach(d => n[d.id] = d.data()); tecnica = n });
    mapCol("hechas", docs => { const n = {}; docs.forEach(d => n[d.id] = d.data()); hechas = n });
    mapCol("registros", docs => { registros = docs.map(d => ({id:d.id, data:d.data()})) });
    mapCol("peso", docs => { pesos = docs.map(d => ({id:d.id, data:d.data()})).filter(p => num(p.data.kg) != null) });
    mapCol("partidos", docs => { partidos = docs.map(d => d.data()).sort((a,b)=> (a.fecha+(a.hora||"99")).localeCompare(b.fecha+(b.hora||"99"))) });
    mapCol("futsal", docs => { futsal = docs.map(d => d.data()).sort((a,b)=> a.fecha.localeCompare(b.fecha)) });
    mapCol("compra", docs => { compras = docs.map(d => ({id:d.id, data:d.data()})) });
    db.doc("info/plan").onSnapshot(s=>{ plan = s.exists ? s.data() : null; softRender() });

    const stamp = () => { const d = new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()) };
    if (remote) setSync(false, "Sin actualizar");
    else { setSync(false, "Cargando…"); render() }
    async function refresh(){
      try {
        const res = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
        if (!res.ok) throw new Error(res.status);
        const fresh = await res.json();
        const changed = !remote || fresh.version !== remote.version;
        remote = fresh; store.set(RKEY, remote);
        if (changed) emitAll();
        if (res.headers.get("x-mi-dia-cache") || !navigator.onLine) setSync(false, "Sin conexión");
        else setSync(true, "Al día · " + stamp());
      } catch(e){
        if (remote) setSync(false, "Sin conexión");
        else { setSync(false, "Sin conexión"); $("#view").innerHTML = `<div class="empty"><b>Abre la app con internet una vez</b>Después funcionará también sin conexión.</div>` }
      }
    }
    refresh();
    ghPull();
    if (gh.pending) ghPush();
    fotosPush();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible"){ refresh(); ghPull(); fotosPush(); if (gh.pending) ghPush() } else if (gh.pending) ghPush() });
    window.addEventListener("online", () => { refresh(); fotosPush(); if (gh.pending) ghPush() });
    setInterval(refresh, 10*60*1000);
    if ("serviceWorker" in navigator){
      // when a new version takes over, reload once so it shows straight away
      let reloaded = false;
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded){ reloaded = true; location.reload() } });
      navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
        reg.update().catch(()=>{});
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(()=>{}) });
      }).catch(()=>{});
    }
  })();
})();


</script>
</body>
</html>
